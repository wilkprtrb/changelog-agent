<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog</title>
<!--
  Changelog Agent widget — self-contained, no external deps.
  Renders a changelog from changelog.json (or an inline JSON blob).
  Embed via: <iframe src="widget.html" ...></iframe>
  or copy this file into your page.
  Generated by Changelog Agent — changelogagent.tech
-->
<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-panel-2: #1c2128;
    --border: #2d333b;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
    --green: #3fb950;
    --red: #f85149;
    --purple: #bc8cff;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding: 24px 20px 16px;
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header { margin-bottom: 28px; }
  .product-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .product-name .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    flex-shrink: 0;
  }
  .tagline {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 4px;
  }

  /* Version block */
  .version {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .version-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .version-tag {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }
  .version-date {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .version-summary {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 16px;
  }

  /* Sections */
  .section { margin-bottom: 18px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .section-title .badge {
    width: 8px; height: 8px; border-radius: 2px;
    flex-shrink: 0;
  }
  .badge-features { background: var(--green); }
  .badge-fixes { background: var(--red); }
  .badge-improvements { background: var(--purple); }

  .entry {
    padding: 10px 0 10px 14px;
    border-left: 2px solid var(--border);
    margin-left: 4px;
  }
  .entry-title { font-size: 15px; font-weight: 600; }
  .entry-body { font-size: 14px; color: var(--text-muted); margin-top: 2px; }

  /* Empty state */
  .empty {
    text-align: center;
    color: var(--text-muted);
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 14px;
  }
  .empty code {
    font-family: var(--mono);
    background: var(--bg-panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12.5px;
  }

  /* Error state */
  .error {
    background: rgba(248, 81, 73, 0.08);
    border: 1px solid rgba(248, 81, 73, 0.4);
    color: #ffa198;
    border-radius: var(--radius);
    padding: 16px 18px;
    font-size: 14px;
  }
  .error code { font-family: var(--mono); font-size: 12.5px; }

  /* Footer badge — the self-promoting marketing asset */
  .footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .made-with {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--text-muted);
    font-size: 12.5px;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .made-with:hover { color: var(--accent); }
  .made-with .logo {
    width: 16px; height: 16px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    color: #0d1117;
    flex-shrink: 0;
  }
  .made-with .logo svg { width: 10px; height: 10px; }
  .made-with .brand { font-weight: 600; color: var(--text); }
  .made-with:hover .brand { color: var(--accent); }

  @media (max-width: 480px) {
    body { padding: 16px 12px 12px; }
    .version { padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
(function () {
  "use strict";

  // ---- Config ----
  // The widget loads changelog.json from the same directory by default.
  // To embed with inline data, set window.CHANGELOG_DATA before this script runs,
  // or pass ?data=inline and define window.CHANGELOG_DATA.
  var DATA_URL = "changelog.json";
  var PRODUCT_LINK = "https://changelogagent.tech";

  // ---- Helpers ----
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") node.className = attrs[k];
        else if (k === "html") node.innerHTML = attrs[k];
        else node.setAttribute(k, attrs[k]);
      });
    }
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // ---- Schema normalization ----
  // The widget accepts two changelog.json shapes:
  //   A) Rich/multi-version (hosted demo): { product, tagline, versions: [
  //        { version, date, summary, sections: { Features: [{title, body}], ... } } ] }
  //   B) CLI output (changelog_agent): { version, date, repo, changes: [
  //        { category, title, summary, commits } ] }
  // We normalize both into the rich shape so the renderer is schema-agnostic.
  function normalize(data) {
    if (!data || typeof data !== "object") return null;

    var product = data.product || data.repo || "Changelog";
    var tagline = data.tagline || "";

    // Shape B: single version + flat changes array
    if (data.changes && Array.isArray(data.changes)) {
      var sections = {};
      var order = ["Features", "Fixes", "Improvements", "Chores"];
      order.forEach(function (cat) { sections[cat] = []; });
      data.changes.forEach(function (ch) {
        var cat = ch.category || "Improvements";
        if (!sections[cat]) sections[cat] = [];
        sections[cat].push({
          title: ch.title || "",
          body: ch.note || ch.summary || ""
        });
      });
      // drop empty sections
      Object.keys(sections).forEach(function (k) {
        if (sections[k].length === 0) delete sections[k];
      });
      return {
        product: product,
        tagline: tagline,
        versions: [{
          version: data.version || "Unreleased",
          date: data.date || "",
          summary: "",
          sections: sections
        }]
      };
    }

    // Shape A: rich multi-version
    if (data.versions && Array.isArray(data.versions)) {
      return {
        product: product,
        tagline: tagline,
        versions: data.versions
      };
    }

    return null;
  }

  // ---- Render ----
  function render(data) {
    var app = document.getElementById("app");
    app.innerHTML = "";

    var norm = normalize(data);
    if (!norm || !Array.isArray(norm.versions) || norm.versions.length === 0) {
      app.appendChild(el("div", { class: "empty" }, [
        "No changelog data found. Place a ",
        el("code", null, ["changelog.json"]),
        " file next to this widget, or pass inline data."
      ]));
      return;
    }

    // Header
    var header = el("div", { class: "header" });
    var name = norm.product || "Changelog";
    header.appendChild(el("div", { class: "product-name" }, [
      el("span", { class: "dot" }),
      el("span", null, [name])
    ]));
    if (norm.tagline) {
      header.appendChild(el("div", { class: "tagline" }, [norm.tagline]));
    }
    app.appendChild(header);

    // Versions
    norm.versions.forEach(function (v) {
      var block = el("div", { class: "version" });

      var head = el("div", { class: "version-head" });
      head.appendChild(el("span", { class: "version-tag" }, [v.version || "Unreleased"]));
      if (v.date) head.appendChild(el("span", { class: "version-date" }, [v.date]));
      block.appendChild(head);

      if (v.summary) {
        block.appendChild(el("div", { class: "version-summary" }, [v.summary]));
      }

      var sections = v.sections || {};
      var order = ["Features", "Fixes", "Improvements", "Chores"];
      var badgeClass = {
        "Features": "badge-features",
        "Fixes": "badge-fixes",
        "Improvements": "badge-improvements",
        "Chores": "badge-improvements"
      };

      order.forEach(function (sectionName) {
        var entries = sections[sectionName];
        if (!entries || entries.length === 0) return;

        var section = el("div", { class: "section" });
        section.appendChild(el("div", { class: "section-title" }, [
          el("span", { class: "badge " + (badgeClass[sectionName] || "badge-improvements") }),
          el("span", null, [sectionName])
        ]));

        entries.forEach(function (entry) {
          var e = el("div", { class: "entry" });
          if (entry.title) e.appendChild(el("div", { class: "entry-title" }, [entry.title]));
          if (entry.body) e.appendChild(el("div", { class: "entry-body" }, [entry.body]));
          section.appendChild(e);
        });

        block.appendChild(section);
      });

      app.appendChild(block);
    });

    // Footer badge — the self-promoting marketing asset
    var footer = el("div", { class: "footer" });
    var badge = el("a", {
      class: "made-with",
      href: PRODUCT_LINK,
      target: "_blank",
      rel: "noopener noreferrer",
      title: "Made with Changelog Agent"
    });
    badge.appendChild(el("span", { class: "logo" }, [
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6"/><path d="M12 19h8"/></svg>'
    ]));
    badge.appendChild(el("span", null, ["Made with "]));
    badge.appendChild(el("span", { class: "brand" }, ["Changelog Agent"]));
    footer.appendChild(badge);
    app.appendChild(footer);
  }

  function showError(msg) {
    var app = document.getElementById("app");
    app.innerHTML = "";
    app.appendChild(el("div", { class: "error" }, [
      "Could not load changelog: ",
      el("code", null, [esc(msg)])
    ]));
  }

  // ---- Load ----
  function load() {
    // 1. Inline data (window.CHANGELOG_DATA) takes priority.
    if (window.CHANGELOG_DATA) {
      render(window.CHANGELOG_DATA);
      return;
    }

    // 2. Otherwise fetch changelog.json from the same directory.
    var xhr = new XMLHttpRequest();
    xhr.open("GET", DATA_URL, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          render(JSON.parse(xhr.responseText));
        } catch (e) {
          showError("invalid JSON: " + e.message);
        }
      } else {
        showError("HTTP " + xhr.status + " (" + DATA_URL + ")");
      }
    };
    xhr.onerror = function () {
      showError("network error loading " + DATA_URL);
    };
    xhr.send();
  }

  // ---- Height reporting (for embedding in an iframe) ----
  // Tell the parent page how tall we are so it can size the iframe.
  function reportHeight() {
    var h = document.body ? document.body.scrollHeight : 0;
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: "changelog-widget-height", height: h }, "*");
      } catch (e) { /* cross-origin; ignore */ }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      load();
      reportHeight();
      window.addEventListener("load", reportHeight);
    });
  } else {
    load();
    reportHeight();
    window.addEventListener("load", reportHeight);
  }
})();
</script>
</body>
</html>
