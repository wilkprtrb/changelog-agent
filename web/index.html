<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog — Changelog Agent</title>
<meta name="description" content="The changelog for Changelog Agent — written by AI, in plain language, and it markets itself.">
<!--
  Changelog Agent — hosted changelog page (Phase 2 UI).
  Serves the self-contained widget + changelog.json.
  This is the seed of the paid hosted tier and our own demo page.
  Generated by Changelog Agent — changelogagent.dev
-->
<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --border: #2d333b;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --purple: #bc8cff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }

  /* Top nav */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
  }
  .nav-brand .logo {
    width: 22px; height: 22px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #0d1117;
  }
  .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    margin-left: 20px;
    transition: color 0.15s ease;
  }
  .nav-links a:hover { color: var(--accent); }

  /* Hero */
  .hero { padding: 48px 0 40px; text-align: center; }
  .hero h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 560px;
    margin: 12px auto 0;
  }

  /* Widget panel */
  .widget-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .widget-panel iframe {
    width: 100%;
    border: 0;
    border-radius: 8px;
    display: block;
    background: #0d1117;
  }

  /* Footer */
  .footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .hero h1 { font-size: 26px; }
    .nav-links a { margin-left: 12px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">
      <span class="logo">CA</span>
      <span>Changelog Agent</span>
    </div>
    <div class="nav-links">
      <a href="https://changelogagent.dev">Home</a>
      <a href="https://changelogagent.dev/pricing">Pricing</a>
    </div>
  </nav>

  <div class="page">
    <div class="hero">
      <h1>Changelog</h1>
      <p>Written by AI, in plain language your customers actually understand — and it markets itself.</p>
    </div>

    <!-- The widget renders the changelog from changelog.json -->
    <div class="widget-panel">
      <iframe id="changelog-widget" src="widget.html" title="Changelog" loading="lazy"></iframe>
    </div>

    <div class="footer">
      <p>Powered by <a href="https://changelogagent.dev">Changelog Agent</a> — your changelog, written by AI, and it markets itself.</p>
    </div>
  </div>

<script>
  // Auto-size the iframe to fit the widget content.
  // The widget posts its height via postMessage; fall back to a reasonable height.
  (function () {
    var iframe = document.getElementById("changelog-widget");
    if (!iframe) return;

    function setHeight(h) {
      if (h && h > 200) iframe.style.height = h + "px";
    }

    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "changelog-widget-height") {
        setHeight(e.data.height);
      }
    });

    // Fallback: measure after load.
    iframe.addEventListener("load", function () {
      try {
        var doc = iframe.contentDocument || iframe.contentWindow.document;
        var h = doc.body ? doc.body.scrollHeight : 0;
        setHeight(h);
      } catch (err) {
        setHeight(900);
      }
    });

    // Initial fallback height.
    setHeight(900);
  })();
</script>
</body>
</html>
